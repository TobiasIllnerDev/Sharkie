<!doctype html>
<html lang="de" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sharkie</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" type="image/x-icon" href="./assets/img/Favicon.png" />
  </head>
  <body>
    <h1>Sharkie</h1>

    <div id="game-container">
      <canvas width="720" height="480" id="canvas"> </canvas>

      <div id="touch-controls" aria-label="Mobile Steuerung">
        <div class="touch-dpad">
          <button class="touch-button touch-up" type="button" data-key="UP" aria-label="Nach oben">▲</button>
          <button class="touch-button touch-left" type="button" data-key="LEFT" aria-label="Nach links">◀</button>
          <button class="touch-button touch-down" type="button" data-key="DOWN" aria-label="Nach unten">▼</button>
          <button class="touch-button touch-right" type="button" data-key="RIGHT" aria-label="Nach rechts">▶</button>
        </div>

        <div class="touch-actions">
          <button class="touch-button touch-attack" type="button" data-key="SPACE" aria-label="Angriff">A</button>
          <button class="touch-button touch-special" type="button" data-key="E" aria-label="Spezialangriff">E</button>
        </div>
      </div>
    </div>

    <div id="orientation-message">
      <p>Bitte drehe dein Gerät ins Querformat.</p>
    </div>

    <script src="./classes/drawable-object.class.js"></script>
    <script src="./classes/movable-object.class.js"></script>
    <script src="./classes/character.class.js"></script>
    <script src="./classes/jelly-fish.class.js"></script>
    <script src="./classes/jelly-fish-yellow.class.js"></script>
    <script src="./classes/jelly-fish-pink.class.js"></script>
    <script src="./classes/jelly-fish-purple.class.js"></script>
    <script src="./classes/jelly-fish-green.class.js"></script>
    <script src="./classes/light.class.js"></script>
    <script src="./classes/collectible-object.class.js"></script>
    <script src="./classes/coin.class.js"></script>
    <script src="./classes/bottle.class.js"></script>
    <script src="./classes/status-bar.class.js"></script>
    <script src="./classes/status-bar-life.class.js"></script>
    <script src="./classes/status-bar-coin.class.js"></script>
    <script src="./classes/status-bar-posion.class.js"></script>
    <script src="./classes/status-bar-boss.class.js"></script>
    <script src="./classes/level.class.js"></script>
    <script src="./classes/background-object.class.js"></script>
    <script src="./classes/keyboard.class.js"></script>
    <script src="./classes/sound-manager.class.js"></script>
    <script src="./classes/ui-controls.class.js"></script>
    <script src="./classes/throwable-object.class.js"></script>
    <script src="./classes/special-bubble.class.js"></script>
    <script src="./classes/endboss.class.js"></script>
    <script src="./classes/start-screen.class.js"></script>
    <script src="./classes/endscreen.class.js"></script>
    <script src="./assets/level/level1.js"></script>
    <script src="./classes/world.class.js"></script>
    <script src="./js/game.js"></script>
  </body>
</html>
